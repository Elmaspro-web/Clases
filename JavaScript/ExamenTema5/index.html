<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <script src="./main.js" type="module" defer></script>
</head>
<body>
    <main>
        <h1>Login</h1>
        <p id="error"></p>
        <form id="formularioLogin">
            <label>Nombre:
            <input type="text" id="nombre" required>
            </label>
            <label>Contraseña:
            <input type="text" id="contrasena" required>
            </label>
            <input type="submit" id="botonSubmitLogin" value="Logearse">
        </form>
    </main>
</body>
</html>
