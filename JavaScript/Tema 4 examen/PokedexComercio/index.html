<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex Ignacio</title>
    <script defer type="module" src="js/main.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Registrar nuevo Pokémon</h1>
        <hr>
        <section>
            <form id="idFormularioPokemon">
                <label
                >Nombre:
                    <input type="text" name="nombre" id="idNombre" required>
                </label>
                <label
                >Tipo:
                    <select id="idTipo" name="tipo">
                        <option value="Fuego" selected>🔥Fuego</option>
                        <option value="Agua">💧Agua</option>
                        <option value="Planta">🌿Planta</option>
                    </select>
                </label>
                <label
                >Nivel:
                    <input type="number" name="nivel" id="idNivel" min="1" max="100" required>
                </label>
                <input type="submit" id="idSubmit" value="Añadir Pokemon">
            </form>
        </section>

        <section>
            <h1>Estadísticas</h1>
            <hr>
            <section id="idSectionFuego" class="sectionStats"><p>🔥Fuego</p>             <p class="nivelPromedio" id="idNivelPromedioFuego"></p></section>
            <section id="idSectionAgua" class="sectionStats"><p>💧Agua</p>              <p class="nivelPromedio" id="idNivelPromedioAgua"></p></section>
            <section id="idSectionPlanta" class="sectionStats"><p>🌿Planta</p>          <p class="nivelPromedio" id="idNivelPromedioPlanta"></p></section>
        </section>

        <section id="botones">
        <button id="idGenerarEstadisticas">🔢 Generar estadísticas</button>
        <button id="idEliminarPokemons">🗑 Borrar todos los Pokémons</button>
        </section>

        <h1>Lista de Pokemon</h1>
        <hr>
        <section id="idSeccionBuscador">
            <label>
                <input type="search" placeholder="Buscar por nombre o por tipo..." id="idBuscadorReal">
            </label>
        </section>
        <section id="verPokemons"></section>
    </main>
</body>
</html>
